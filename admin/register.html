<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun Warga - RW 16</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="auth-page">
    <div class="auth-wrapper">
      <!-- Kolom Kiri: Visual & Branding Warga -->
      <div class="auth-hero-side">
        <div class="auth-hero-overlay"></div>

        <!-- Top Brand Header -->
        <a href="../index.html" class="auth-brand" title="Kembali ke Beranda">
          <img
            src="../images/Logoerwe.png"
            alt="Logo RW 16"
            class="auth-brand-logo"
          />
          <div class="auth-brand-text">
            <span class="auth-brand-title">RW 16 Cibabat</span>
            <span class="auth-brand-sub">Kota Cimahi</span>
          </div>
        </a>

        <!-- Bottom Headline & Info -->
        <div class="auth-hero-content">
          <div class="auth-accent-bar"></div>
          <h1 class="auth-hero-title">
            Pelayanan Warga,<br />Lebih Mudah.
          </h1>
          <p class="auth-hero-desc">
            Akses layanan administrasi RW 16 Cibabat dalam satu tempat.
          </p>
          <div class="auth-verified-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Portal Resmi Pelayanan RW 16 Cibabat</span>
          </div>
        </div>
      </div>

      <!-- Kolom Kanan: Card Form -->
      <div class="auth-form-side">
        <div class="auth-card">
          <div class="auth-card-header">
            <h2>Daftar Akun Warga</h2>
            <p>Lengkapi data Anda untuk mendaftar akun layanan digital RW 16.</p>
          </div>

          <div id="error-message" class="auth-alert error" style="display: none;"></div>

          <form id="register-form" class="auth-form">
            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  id="email"
                  placeholder="Masukkan email Anda"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Kata Sandi</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="password"
                  placeholder="Minimal 6 karakter"
                  required
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="password-toggle-btn"
                  id="toggle-register-password"
                  aria-label="Tampilkan kata sandi"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" id="register-submit-btn" class="auth-submit-btn">
              <i class="fas fa-user-plus"></i>
              <span>Daftar Sekarang</span>
            </button>
          </form>

          <div class="auth-card-footer">
            <span>Sudah punya akun?</span>
            <a href="login.html">Masuk di sini</a>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/register.js" type="module"></script>
    <script>
      // Toggle visibilitas password
      const toggleBtn = document.getElementById("toggle-register-password");
      const passwordInput = document.getElementById("password");
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener("click", () => {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          const icon = toggleBtn.querySelector("i");
          if (icon) {
            icon.classList.toggle("fa-eye", !isPassword);
            icon.classList.toggle("fa-eye-slash", isPassword);
          }
        });
      }
    </script>
  </body>
</html>
