<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - RW 16</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      /* CSS tambahan khusus untuk halaman login */
      .login-container {
        max-width: 420px;
        margin: 4.5rem auto;
        padding: 2.5rem;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .login-container h1 {
        margin-bottom: 1.5rem;
        border-left: none;
        padding-left: 0;
        font-size: 1.8rem;
        color: #0f172a;
      }
      .login-container input {
        width: 100%;
        padding: 0.85rem 1rem;
        margin-bottom: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }
      .login-container input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
      }
      .login-container button {
        width: 100%;
        padding: 0.85rem;
        border: none;
        background-color: var(--primary-color);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        margin-top: 0.5rem;
        transition: background-color 0.2s, transform 0.2s, opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .login-container button:hover:not(:disabled) {
        background-color: #1a252f;
        transform: translateY(-1px);
      }
      .login-container button:disabled {
        opacity: 0.75;
        cursor: not-allowed;
      }
      .remember-me-container {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin: 0.2rem 0 1.2rem;
        text-align: left;
      }
      .remember-me-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        font-size: 0.9rem;
        color: #475569;
        user-select: none;
      }
      .remember-me-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        cursor: pointer;
        accent-color: var(--primary-color);
      }
      #error-message {
        display: none;
        background-color: #fee2e2;
        color: #b91c1c;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-top: 1.25rem;
        font-size: 0.88rem;
        text-align: left;
        border: 1px solid #fca5a5;
        animation: shake 0.3s ease;
      }
      #success-message {
        display: none;
        background-color: #dcfce7;
        color: #15803d;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-bottom: 1.25rem;
        font-size: 0.88rem;
        text-align: left;
        border: 1px solid #86efac;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="login-container">
        <h1>Login</h1>
        <div id="success-message"></div>
        <form id="login-form">
          <input type="email" id="email" placeholder="Email" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <div class="remember-me-container">
            <label class="remember-me-label">
              <input type="checkbox" id="remember-me" />
              <span>Ingat saya di perangkat ini</span>
            </label>
          </div>
          <button type="submit" id="login-submit-btn">Login</button>
        </form>
        <div id="error-message"></div>
        <p style="margin-top: 1.5rem; font-size: 0.92rem; color: #64748b;">
          Belum punya akun?
          <a
            href="register.html"
            style="color: var(--primary-color); font-weight: 600; text-decoration: none;"
            >Daftar</a
          >
        </p>
      </div>
    </main>

    <script src="../js/auth.js" type="module"></script>
  </body>
</html>
