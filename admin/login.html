<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Pelayanan Warga RW 16</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="auth-page">
    <div class="auth-wrapper">
      <!-- Kolom Kiri: Visual & Branding Warga -->
      <div class="auth-hero-side">
        <div class="auth-hero-overlay"></div>

        <!-- Top Brand Header -->
        <a href="../index.html" class="auth-brand" title="Kembali ke Beranda">
          <img
            src="../images/Logoerwe.png"
            alt="Logo RW 16"
            class="auth-brand-logo"
          />
          <div class="auth-brand-text">
            <span class="auth-brand-title">RW 16 Cibabat</span>
            <span class="auth-brand-sub">Kota Cimahi</span>
          </div>
        </a>

        <!-- Bottom Headline & Info -->
        <div class="auth-hero-content">
          <div class="auth-accent-bar"></div>
          <h1 class="auth-hero-title">
            Pelayanan Warga,<br />Lebih Mudah.
          </h1>
          <p class="auth-hero-desc">
            Akses layanan administrasi RW 16 Cibabat dalam satu tempat.
          </p>
          <div class="auth-verified-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Portal Resmi Pelayanan RW 16 Cibabat</span>
          </div>
        </div>
      </div>

      <!-- Kolom Kanan: Card Form -->
      <div class="auth-form-side">
        <div class="auth-card">
          <div class="auth-card-header">
            <h2>Selamat Datang Kembali</h2>
            <p>Masuk untuk melanjutkan layanan administrasi.</p>
          </div>

          <div id="success-message" class="auth-alert success" style="display: none;"></div>
          <div id="error-message" class="auth-alert error" style="display: none;"></div>

          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  id="email"
                  placeholder="Masukkan email Anda"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Kata Sandi</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="password"
                  placeholder="Masukkan kata sandi Anda"
                  required
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="password-toggle-btn"
                  id="toggle-password"
                  aria-label="Tampilkan kata sandi"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="forgot-password-row">
                <a href="#" id="forgot-password-link" class="forgot-link">Lupa kata sandi?</a>
              </div>
            </div>

            <div class="remember-me-container">
              <label class="remember-me-label">
                <input type="checkbox" id="remember-me" />
                <span>Ingat saya di perangkat ini</span>
              </label>
            </div>

            <button type="submit" id="login-submit-btn" class="auth-submit-btn">
              <i class="fas fa-arrow-right-to-bracket"></i>
              <span>Masuk</span>
            </button>
          </form>

          <div class="auth-card-footer">
            <span>Belum punya akun?</span>
            <a href="register.html">Daftar sekarang</a>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/auth.js" type="module"></script>
    <script>
      // Toggle visibilitas password
      const toggleBtn = document.getElementById("toggle-password");
      const passwordInput = document.getElementById("password");
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener("click", () => {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          const icon = toggleBtn.querySelector("i");
          if (icon) {
            icon.classList.toggle("fa-eye", !isPassword);
            icon.classList.toggle("fa-eye-slash", isPassword);
          }
        });
      }

      // Dialog panduan lupa kata sandi
      const forgotLink = document.getElementById("forgot-password-link");
      if (forgotLink) {
        forgotLink.addEventListener("click", (e) => {
          e.preventDefault();
          alert("Untuk reset kata sandi, silakan hubungi pengurus sekretariat RW 16 melalui kontak WhatsApp yang tertera di website.");
        });
      }
    </script>
  </body>
</html>
